<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d">
  <title id="t">How the cabin's solar system is wired</title>
  <desc id="d">Four PS400 panels feed two Anker SOLIX F3800 batteries, two panels each. Both batteries connect to a Home Power Panel that feeds the cabin. One F3800 is stuck on old firmware.</desc>
  <rect width="1376" height="768" fill="#f6f2ea"/>
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#1f1a16">
    <text x="64" y="84" font-size="16" letter-spacing="4" fill="#8a2f22" font-weight="600">THE SETUP</text>
    <text x="64" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700">Sun to cabin, in four boxes</text>

    <!-- panels -->
    <g>
      <rect x="64" y="220" width="250" height="120" fill="#2f3a46" stroke="#1e262e" stroke-width="3"/>
      <text x="189" y="270" text-anchor="middle" fill="#f6f2ea" font-size="20" font-weight="600">2 × PS400</text>
      <text x="189" y="300" text-anchor="middle" fill="#c9d1d8" font-size="16">≈ 800 W</text>
      <rect x="64" y="440" width="250" height="120" fill="#2f3a46" stroke="#1e262e" stroke-width="3"/>
      <text x="189" y="490" text-anchor="middle" fill="#f6f2ea" font-size="20" font-weight="600">2 × PS400</text>
      <text x="189" y="520" text-anchor="middle" fill="#c9d1d8" font-size="16">≈ 800 W</text>
    </g>
    <!-- batteries -->
    <g>
      <rect x="430" y="210" width="270" height="140" fill="#fffdf8" stroke="#1f1a16" stroke-width="3"/>
      <text x="565" y="265" text-anchor="middle" font-size="20" font-weight="600">F3800 #1</text>
      <text x="565" y="295" text-anchor="middle" font-size="16" fill="#5c554f">battery + inverter</text>
      <text x="565" y="322" text-anchor="middle" font-size="14" fill="#5c554f" letter-spacing="1">FIRMWARE: CURRENT</text>

      <rect x="430" y="430" width="270" height="140" fill="#fffdf8" stroke="#8a2f22" stroke-width="3" stroke-dasharray="10 6"/>
      <text x="565" y="485" text-anchor="middle" font-size="20" font-weight="600">F3800 #2</text>
      <text x="565" y="515" text-anchor="middle" font-size="16" fill="#5c554f">battery + inverter</text>
      <text x="565" y="542" text-anchor="middle" font-size="14" fill="#8a2f22" letter-spacing="1" font-weight="600">FIRMWARE: STUCK</text>
    </g>
    <!-- HPP -->
    <rect x="820" y="300" width="250" height="180" fill="#fffdf8" stroke="#1f1a16" stroke-width="3"/>
    <text x="945" y="375" text-anchor="middle" font-size="20" font-weight="600">Home Power</text>
    <text x="945" y="402" text-anchor="middle" font-size="20" font-weight="600">Panel</text>
    <text x="945" y="438" text-anchor="middle" font-size="15" fill="#5c554f">app shows in vs. out</text>
    <!-- cabin -->
    <rect x="1170" y="300" width="150" height="180" fill="#8a2f22" stroke="#5a1d14" stroke-width="3"/>
    <text x="1245" y="380" text-anchor="middle" fill="#f6f2ea" font-size="20" font-weight="600">Cabin</text>
    <text x="1245" y="408" text-anchor="middle" fill="#f1d9d3" font-size="15">loads</text>

    <!-- arrows -->
    <g stroke="#1f1a16" stroke-width="3" fill="none">
      <path d="M314 280 H420"/><path d="M314 500 H420"/>
      <path d="M700 280 C 760 280 760 360 810 360"/>
      <path d="M700 500 C 760 500 760 420 810 420" stroke="#8a2f22" stroke-dasharray="8 6"/>
      <path d="M1070 390 H1160"/>
    </g>
    <g fill="#1f1a16">
      <path d="M420 272 l14 8 -14 8z"/><path d="M420 492 l14 8 -14 8z"/>
      <path d="M810 352 l14 8 -14 8z"/><path d="M810 412 l14 8 -14 8z" fill="#8a2f22"/>
      <path d="M1160 382 l14 8 -14 8z"/>
    </g>
    <!-- callout -->
    <rect x="64" y="630" width="1256" height="80" fill="#efe7da"/>
    <rect x="64" y="630" width="6" height="80" fill="#8a2f22"/>
    <text x="96" y="664" font-size="18" font-weight="600">The suspect: one F3800 won't take its firmware update over Bluetooth.</text>
    <text x="96" y="692" font-size="16" fill="#5c554f">If it has dropped out of sync with the Home Power Panel, only one battery is really contributing. That would match losing about half the power.</text>
  </g>
</svg>
