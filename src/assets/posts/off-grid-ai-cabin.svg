<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d">
  <title id="t">Illustrated aerial view of the off-grid AI cabin</title>
  <desc id="d">A container cabin in a forest clearing with two rows of solar panels, a battery and power panel enclosure, and a small computer inside.</desc>
  <defs>
    <pattern id="grass" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#e9e3d3"/>
      <path d="M3 14 l2 -5 M11 6 l1 -4" stroke="#cfc6ae" stroke-width="1.4" stroke-linecap="round"/>
    </pattern>
    <pattern id="cells" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#2f3a46"/>
      <path d="M0 0 H22 V22" fill="none" stroke="#4d5b6a" stroke-width="1.5"/>
    </pattern>
    <pattern id="ribs" width="12" height="10" patternUnits="userSpaceOnUse">
      <rect width="12" height="10" fill="#8a2f22"/>
      <rect width="5" height="10" fill="#7a281d"/>
    </pattern>
  </defs>
  <rect width="1376" height="768" fill="#f6f2ea"/>
  <!-- clearing -->
  <path d="M250 640 C 180 480 300 210 560 170 C 820 130 1110 190 1160 360 C 1210 540 1040 690 760 700 C 520 710 300 720 250 640 Z" fill="url(#grass)"/>
  <!-- path -->
  <path d="M700 700 C 690 620 650 560 620 500" fill="none" stroke="#d8ccb2" stroke-width="26" stroke-linecap="round"/>
  <!-- trees -->
  <g fill="#5d6b4f" stroke="#46523b" stroke-width="2">
    <circle cx="90" cy="120" r="70"/><circle cx="210" cy="70" r="60"/><circle cx="150" cy="260" r="80"/>
    <circle cx="70" cy="420" r="85"/><circle cx="160" cy="580" r="75"/><circle cx="80" cy="710" r="70"/>
    <circle cx="370" cy="60" r="55"/><circle cx="520" cy="40" r="50"/><circle cx="1290" cy="110" r="75"/>
    <circle cx="1180" cy="60" r="55"/><circle cx="1310" cy="300" r="80"/><circle cx="1240" cy="480" r="70"/>
    <circle cx="1320" cy="640" r="80"/><circle cx="1150" cy="720" r="60"/><circle cx="960" cy="60" r="50"/>
    <circle cx="420" cy="740" r="55"/><circle cx="260" cy="420" r="45"/>
  </g>
  <g fill="#73805f">
    <circle cx="75" cy="105" r="30"/><circle cx="135" cy="240" r="34"/><circle cx="55" cy="400" r="36"/>
    <circle cx="1275" cy="95" r="32"/><circle cx="1295" cy="285" r="34"/><circle cx="1305" cy="625" r="34"/>
    <circle cx="145" cy="565" r="30"/><circle cx="1225" cy="465" r="28"/>
  </g>
  <!-- container cabin -->
  <g transform="rotate(-8 600 400)">
    <rect x="455" y="350" width="330" height="110" fill="#000" opacity="0.12" transform="translate(12 14)"/>
    <rect x="455" y="350" width="330" height="110" fill="url(#ribs)" stroke="#5a1d14" stroke-width="3"/>
    <rect x="470" y="365" width="70" height="80" fill="#d9e2e6" stroke="#5a1d14" stroke-width="2"/>
    <rect x="700" y="365" width="70" height="80" fill="#d9e2e6" stroke="#5a1d14" stroke-width="2"/>
  </g>
  <!-- solar rows -->
  <g transform="rotate(-8 900 300)">
    <rect x="800" y="250" width="264" height="66" fill="#000" opacity="0.12" transform="translate(8 10)"/>
    <rect x="800" y="250" width="264" height="66" fill="url(#cells)" stroke="#1e262e" stroke-width="3"/>
    <rect x="800" y="345" width="264" height="66" fill="#000" opacity="0.12" transform="translate(8 10)"/>
    <rect x="800" y="345" width="264" height="66" fill="url(#cells)" stroke="#1e262e" stroke-width="3"/>
    <line x1="932" y1="250" x2="932" y2="316" stroke="#1e262e" stroke-width="3"/>
    <line x1="932" y1="345" x2="932" y2="411" stroke="#1e262e" stroke-width="3"/>
  </g>
  <!-- conduit -->
  <path d="M800 400 C 780 430 770 440 760 450" fill="none" stroke="#1f1a16" stroke-width="3" stroke-dasharray="7 6"/>
  <!-- battery enclosure -->
  <rect x="700" y="452" width="90" height="56" fill="#efe9dd" stroke="#1f1a16" stroke-width="3"/>
  <rect x="712" y="464" width="30" height="32" fill="#cfc8bb" stroke="#1f1a16" stroke-width="2"/>
  <rect x="748" y="464" width="30" height="32" fill="#cfc8bb" stroke="#1f1a16" stroke-width="2"/>
  <!-- labels -->
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#1f1a16" letter-spacing="2.5">
    <line x1="560" y1="330" x2="430" y2="282" stroke="#8a2f22" stroke-width="2"/>
    <circle cx="560" cy="330" r="5" fill="#8a2f22"/>
    <text x="310" y="240" font-weight="600">CONTAINER CABIN</text>
    <text x="310" y="266" font-size="16" fill="#5c554f" letter-spacing="1">All-electric. Fridge, water heater, basics.</text>

    <line x1="1000" y1="245" x2="1060" y2="175" stroke="#8a2f22" stroke-width="2"/>
    <circle cx="1000" cy="245" r="5" fill="#8a2f22"/>
    <text x="900" y="140" font-weight="600">4 × ANKER PS400 PANELS</text>
    <text x="900" y="166" font-size="16" fill="#5c554f" letter-spacing="1">Two per battery, about 800 W each.</text>

    <line x1="790" y1="490" x2="880" y2="560" stroke="#8a2f22" stroke-width="2"/>
    <circle cx="790" cy="490" r="5" fill="#8a2f22"/>
    <text x="870" y="590" font-weight="600">2 × F3800 + HOME POWER PANEL</text>
    <text x="870" y="616" font-size="16" fill="#5c554f" letter-spacing="1">Where half the power goes missing.</text>
  </g>
  <rect x="1100" y="732" width="276" height="36" fill="#f6f2ea"/>
  <text x="1356" y="756" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5c554f" letter-spacing="2">ILLUSTRATION · NOT TO SCALE</text>
</svg>
