<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d">
  <title id="t">The planned off-grid AI stack</title>
  <desc id="d">Sun to panels to batteries to a small power-efficient computer such as a Mac Mini, running local models that power specialized agents with no cloud bill.</desc>
  <rect width="1376" height="768" fill="#f6f2ea"/>
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#1f1a16">
    <text x="64" y="84" font-size="16" letter-spacing="4" fill="#8a2f22" font-weight="600">WHAT'S NEXT</text>
    <text x="64" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700">Agents that run on sunshine</text>

    <!-- sun -->
    <g transform="translate(150 380)">
      <circle r="58" fill="#c8892c"/>
      <g stroke="#c8892c" stroke-width="6" stroke-linecap="round">
        <line x1="0" y1="-78" x2="0" y2="-98"/><line x1="0" y1="78" x2="0" y2="98"/>
        <line x1="-78" y1="0" x2="-98" y2="0"/><line x1="78" y1="0" x2="98" y2="0"/>
        <line x1="55" y1="55" x2="69" y2="69"/><line x1="-55" y1="-55" x2="-69" y2="-69"/>
        <line x1="55" y1="-55" x2="69" y2="-69"/><line x1="-55" y1="55" x2="-69" y2="69"/>
      </g>
    </g>
    <text x="150" y="530" text-anchor="middle" font-size="18" font-weight="600">Sun</text>

    <!-- panels -->
    <rect x="290" y="330" width="170" height="100" fill="#2f3a46" stroke="#1e262e" stroke-width="3"/>
    <text x="375" y="530" text-anchor="middle" font-size="18" font-weight="600">Panels</text>
    <text x="375" y="556" text-anchor="middle" font-size="15" fill="#5c554f">4 × PS400</text>

    <!-- batteries -->
    <rect x="530" y="320" width="70" height="120" rx="6" fill="#fffdf8" stroke="#1f1a16" stroke-width="3"/>
    <rect x="615" y="320" width="70" height="120" rx="6" fill="#fffdf8" stroke="#1f1a16" stroke-width="3"/>
    <text x="607" y="530" text-anchor="middle" font-size="18" font-weight="600">Batteries</text>
    <text x="607" y="556" text-anchor="middle" font-size="15" fill="#5c554f">2 × F3800</text>

    <!-- mini computer -->
    <rect x="770" y="350" width="150" height="60" rx="14" fill="#d9d6d0" stroke="#1f1a16" stroke-width="3"/>
    <circle cx="890" cy="380" r="5" fill="#5c554f"/>
    <text x="845" y="530" text-anchor="middle" font-size="18" font-weight="600">Small computer</text>
    <text x="845" y="556" text-anchor="middle" font-size="15" fill="#5c554f">Mac Mini or M1 laptop</text>

    <!-- agents -->
    <g>
      <rect x="1010" y="250" width="300" height="250" fill="#fffdf8" stroke="#1f1a16" stroke-width="3"/>
      <text x="1160" y="290" text-anchor="middle" font-size="15" letter-spacing="2" fill="#5c554f" font-weight="600">LOCAL MODELS</text>
      <g font-size="16">
        <rect x="1035" y="312" width="250" height="42" fill="#8a2f22"/>
        <text x="1160" y="339" text-anchor="middle" fill="#f6f2ea" font-weight="600">Specialized agent</text>
        <rect x="1035" y="364" width="250" height="42" fill="#8a2f22" opacity="0.85"/>
        <text x="1160" y="391" text-anchor="middle" fill="#f6f2ea" font-weight="600">Specialized agent</text>
        <rect x="1035" y="416" width="250" height="42" fill="#8a2f22" opacity="0.7"/>
        <text x="1160" y="443" text-anchor="middle" fill="#f6f2ea" font-weight="600">Sub-agent on Blocks</text>
      </g>
    </g>
    <text x="1160" y="530" text-anchor="middle" font-size="18" font-weight="600">Agents</text>
    <text x="1160" y="556" text-anchor="middle" font-size="15" fill="#5c554f">no cloud bill</text>

    <g stroke="#1f1a16" stroke-width="3" fill="none">
      <path d="M256 380 H280"/><path d="M462 380 H520"/><path d="M688 380 H760"/><path d="M922 380 H1000"/>
    </g>
    <g fill="#1f1a16">
      <path d="M280 372 l14 8 -14 8z"/><path d="M520 372 l14 8 -14 8z"/><path d="M760 372 l14 8 -14 8z"/><path d="M1000 372 l14 8 -14 8z"/>
    </g>

    <rect x="64" y="630" width="1256" height="80" fill="#efe7da"/>
    <rect x="64" y="630" width="6" height="80" fill="#8a2f22"/>
    <text x="96" y="664" font-size="18" font-weight="600">The rule for the whole stack: measure what each box loses, not just what it can deliver.</text>
    <text x="96" y="692" font-size="16" fill="#5c554f">Local AI only works off-grid if the power system underneath it is honest about its own losses.</text>
  </g>
</svg>
